
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Analysis | Cyber Monitor</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#080d16;
 color:#e5edf5;font-family:Arial,sans-serif
}
header,.panel{
 background:#111b2b;padding:22px;
 border:1px solid #26384b;border-radius:12px;
 margin-bottom:18px
}
h1,h2{color:#00e69a}
a{color:#00e69a;text-decoration:none}
input{
 width:100%;padding:14px;margin:12px 0;
 background:#080d16;color:white;
 border:1px solid #33475d;border-radius:8px
}
button{
 background:#00b77b;color:#04140e;
 padding:12px 20px;border:0;border-radius:8px;
 font-weight:bold
}
#result{margin-top:18px;line-height:2;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>CYBER MONITOR</h1>
<p>Domain Intelligence Analysis</p>
<a href="index.html">← العودة للرئيسية</a>
</header>

<div class="panel">
<h2>تحليل النطاقات</h2>
<p>أدخل اسم نطاق لفحص بنيته الأساسية.</p>

<input id="domain" dir="ltr"
placeholder="example.com">

<button onclick="analyze()">بدء التحليل</button>

<div id="result"></div>
</div>

<script>
 function saveDomainReport(domain) {
    const reports = JSON.parse(
        localStorage.getItem("cyberMonitorReports") || "[]"
    );

    reports.unshift({
        type: "Domain Analysis",
        value: domain,
        date: new Date().toLocaleString("ar")
    });

    localStorage.setItem(
        "cyberMonitorReports",
        JSON.stringify(reports)
    );
 }
function analyze(){
 const value=document.getElementById("domain").value.trim();
 const out=document.getElementById("result");

 out.textContent="";

 let domain=value.replace(/^https?:\/\//i,"").split("/")[0].toLowerCase();

 const valid=/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(domain);

 if(!valid){
  out.textContent="اسم النطاق غير صحيح. مثال: example.com";
  return;
 }

 const title=document.createElement("h3");
 title.textContent="نتيجة التحليل";

 const name=document.createElement("p");
 name.textContent="النطاق: "+domain;

 const status=document.createElement("p");
 status.textContent="الحالة: صيغة النطاق صحيحة";

 const note=document.createElement("p");
 note.textContent="هذا فحص محلي للصيغة فقط، ولا يؤكد ملكية النطاق أو نشاطه أو سلامته.";

 out.append(title,name,status,note);
 saveDomainReport(domain);
 let activities = JSON.parse(
  localStorage.getItem("cyberMonitorActivityLog") || "[]"
);

activities.unshift({
  action: "تم تحليل نطاق Domain",
  time: new Date().toLocaleString("ar")
});

localStorage.setItem(
  "cyberMonitorActivityLog",
  JSON.stringify(activities.slice(0, 10))
);
}
</script>
</body>
</html>
